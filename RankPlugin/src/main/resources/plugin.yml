name: RankPlugin
version: 1.0.0
main: com.slapland.rank.RankPlugin
api-version: '1.20'
author: SlapLand
softdepend: [LuckPerms]
commands:
  rank:
    description: Change a player's rank using the configured LuckPerms track
    usage: /rank <player> the <rank>
    permission: rankplugin.rank
permissions:
  rankplugin.rank:
    description: Allows /rank
    default: op
