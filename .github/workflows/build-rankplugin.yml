name: Build RankPlugin

on:
  push:
    paths:
      - 'RankPlugin/**'
      - '.github/workflows/build-rankplugin.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RankPlugin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: RankPlugin
          path: RankPlugin/target/RankPlugin-1.0.0.jar
