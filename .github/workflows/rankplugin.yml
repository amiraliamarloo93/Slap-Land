name: Build RankPlugin
on:
  push:
    paths:
      - 'RankPlugin/**'
      - '.github/workflows/rankplugin.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RankPlugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: RankPlugin
          path: RankPlugin/target/RankPlugin-1.0.0.jar
