name: RankPlugin
version: 1.0.2
main: com.slapland.rankplugin.RankPlugin
api-version: '1.20'
author: Slap Land
description: Safe /rank command for LuckPerms ranks track
softdepend:
  - LuckPerms
commands:
  rank:
    description: Change a player's managed rank
    usage: /rank <Player_Name> the <Rank_Name>
permissions:
  rankplugin.rank:
    description: Allows the /rank command to reach the internal Admin/Owner check
    default: true
