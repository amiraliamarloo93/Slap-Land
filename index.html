<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SLAP LAND</title>

    <meta name="description"
          content="سرور ماینکرفت اسلپ لند">

    <meta name="theme-color"
          content="#0d111f">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <!-- پس زمینه -->

    <div class="background">

        <div class="blur blue"></div>

        <div class="blur orange"></div>

        <div class="particles"></div>

    </div>

    <!-- صفحه -->

    <main class="container">

        <!-- عنوان -->

        <header class="hero">

            <h1 class="server-name">

                SLAP LAND

            </h1>

            <p class="server-description">

                سرور ماینکرفت

            </p>

            <p class="server-support">

                پشتیبانی از تمامی نسخه‌های Java و Bedrock

            </p>

        </header>

        <!-- کارت -->

        <section
            class="server-card"
            id="serverCard">

            <div class="card-header">

                <span>

                    وضعیت سرور

                </span>

                <span
                    id="status"
                    class="status loading">

                    درحال بررسی...

                </span>

            </div>

            <div class="divider"></div>

            <div class="card-item">

                <span>

                    👥 بازیکنان

                </span>

                <span id="players">

                    --

                </span>

            </div>

            <div class="card-item">

                <span>

                    🎮 نسخه

                </span>

                <span id="version">

                    --

                </span>

            </div>

            <div class="card-item">

                <span>

                    📡 آدرس

                </span>

                <span id="ip">

                    amir_kalam-srv-slap_landjava.play.mihancraft.com

                </span>

            </div>

            <div class="card-item">

                <span>

                    🔌 پورت

                </span>

                <span>

                    25566

                </span>

            </div>

        </section>

        <!-- دکمه ها -->

        <section class="actions">

            <button id="copyButton">

                کپی آی‌پی

            </button>

            <button id="refreshButton">

                بروزرسانی

            </button>

        </section>

        <p id="message"></p>

    </main>

    <!-- فوتر -->

    <footer>

        <div class="developer">

            <img
                src="Logo.png"
                alt="Logo"
                class="footer-logo">

            <span>

                سازنده :
                <strong>

                    امیرکلام

                </strong>

            </span>

        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
